groups:
- name: host-availability
  interval: 30s
  rules:
  - record: hm:node:info
    expr: max by(cluster,zone,host,machine,node) (0 * up{job="kubelet",cluster!="",zone!="",node!=""} + 1)
  - record: hm:node:up
    expr: (max by(cluster,node) (up{job="kubelet",cluster!="",node!=""} * (timestamp(up{job="kubelet",cluster!="",node!=""})
      > bool time() - 90))) or on(cluster,node) (0 * hm:node:info)
  - record: hm:node:ready
    expr: |-
      (max by(cluster,node) (
        kube_node_status_condition{condition="Ready",status="true"}
        and (timestamp(kube_node_status_condition{condition="Ready",status="true"}) > time() - 90)
        and on(job,instance) (up{job="kube-state-metrics"} == 1)
      ) * on(cluster,node) hm:node:up) or on(cluster,node) (0 * hm:node:info)
- name: service-overview
  interval: 30s
  rules:
  - record: hm:service_instance:info
    expr: |-
      ((max by(namespace,pod,node) (kube_pod_info{namespace="hm",node!=""} and (timestamp(kube_pod_info{namespace="hm",node!=""}) > time() - 90))
        and on(namespace,pod) (max by(namespace,pod) (kube_pod_status_phase{namespace="hm",phase!~"Succeeded|Failed"}) == 1))
       * on(namespace,pod) group_left(service)
       max by(namespace,pod,service) (
         label_replace(kube_pod_labels{namespace="hm",label_hm_gitops_service!=""}, "service", "$1", "label_hm_gitops_service", "(.+)")
         or
         label_replace(kube_pod_labels{namespace="hm",label_hm_gitops_service="",label_app_kubernetes_io_name!=""}, "service", "$1", "label_app_kubernetes_io_name", "(.+)")
       ))
       * on(node) group_left(cluster,zone) max by(node,cluster,zone) (hm:node:info)
  - record: hm:service_instance:ready
    expr: |-
      (
        (max by(namespace,pod) (
          kube_pod_status_ready{namespace="hm",condition="true"}
          and (timestamp(kube_pod_status_ready{namespace="hm",condition="true"}) > time() - 90)
          and on(job,instance) (up{job="kube-state-metrics"} == 1)
        ) * on(namespace,pod) group_left(service,cluster,zone,node) hm:service_instance:info{cluster!=""})
        * on(cluster,node) group_left() hm:node:ready
      ) or on(namespace,pod) (0 * hm:service_instance:info{cluster!=""})
  - record: hm:service_instance:down
    expr: hm:service_instance:info - hm:service_instance:ready
  - record: hm:service_instance:cpu_cores
    expr: sum by(namespace,pod) (rate(container_cpu_usage_seconds_total{job="kubelet",namespace="hm",container!=""}[2m]))
      * on(namespace,pod) group_left(service,cluster,zone,node) hm:service_instance:info{cluster!=""}
  - record: hm:service_instance:memory_bytes
    expr: max by(namespace,pod) (pod_memory_working_set_bytes{job="kubelet",namespace="hm"}) * on(namespace,pod)
      group_left(service,cluster,zone,node) hm:service_instance:info{cluster!=""}
  - record: hm:service_instance:restarts_1h
    expr: sum by(namespace,pod) (increase(kube_pod_container_status_restarts_total{namespace="hm"}[1h])) * on(namespace,pod)
      group_left(service,cluster,zone,node) hm:service_instance:info{cluster!=""}
