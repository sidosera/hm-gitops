groups:
- name: gateway-connectivity
  interval: 30s
  rules:
  - alert: GatewayTransportUnavailable
    expr: (probe_success{job="gateway-transport-probes",check=~"primary|backup|split-default"} ==
      0) and on(instance) (probe_success{job="gateway-transport-probes",check="internet"} == 1)
    for: 3m
    labels:
      severity: warning
      service: gateway
    annotations:
      summary: Gateway in {{ $labels.source_zone }} {{ $labels.check }} path cannot reach
        the expected upstream exit
      description: Direct internet control succeeds but this authenticated path fails.
        Check the transport and compare backup. This is a datacenter vantage point,
        not a residential ISP.
  - alert: GatewayTelemetryUnavailable
    expr: up{job=~"node-exporter|gateway-blackbox|gateway-transport-probes"} == 0
    for: 3m
    labels:
      severity: warning
      service: gateway
    annotations:
      summary: Gateway in {{ $labels.source_zone }} telemetry unavailable
      description: Monitoring cannot reach an mTLS endpoint; VPN blocking is not established.
        Check the source host, certificates, source-IP firewall rules and network path.
  - alert: GatewayInternetUnavailable
    expr: probe_success{job="gateway-transport-probes",check="internet"} == 0
    for: 3m
    labels:
      severity: warning
      service: gateway
    annotations:
      summary: Gateway in {{ $labels.source_zone }} direct-internet control failed
      description: Do not diagnose this as a VPN transport block; check the source network
        and the control target.
- name: vpn-end-to-end
  interval: 30s
  rules:
  - alert: VPNWebsiteAccessFailed
    expr: probe_success{probe_scope="public-client",check="client-web"} == 0
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.site }} failed through {{ $labels.target_region }} Gateway
        from {{ $labels.source_region }}'
      description: A real client using the public VPN listener could not fetch the
        expected HTTPS page. Inspect HTTP status, matching client-exit check and transport
        diagnostics; the destination may also reject VPN traffic.
  - alert: VPNProbeUnavailable
    expr: up{job="vpn-client-probes"} == 0
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: VPN Probe in {{ $labels.source_region }} unavailable
      description: Probe telemetry is unavailable; website connectivity is unknown.
