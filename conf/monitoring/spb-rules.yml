groups:
- name: host-telemetry
  interval: 30s
  rules:
  - alert: NodeTelemetryUnavailable
    expr: up{job="node-exporter"} == 0
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: 'Node telemetry unavailable in {{ $labels.zone }}'
      description: Host metrics are unavailable. Check the node, mTLS and private monitoring path.
- name: vpn-end-to-end
  interval: 30s
  rules:
  - alert: VPNWebsiteAccessFailed
    expr: probe_success{probe_scope="public-client",check="client-web"} == 0
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.site }} failed through {{ $labels.target_zone }} Gateway
        from {{ $labels.source_zone }}'
      description: The VPN client could not fetch the expected HTTPS page. Compare
        the direct baseline for the same site, exit-IP check and gateway traffic.
        A destination can also reject VPN egress.
  - alert: VPNProbeUnavailable
    expr: up{job="vpn-client-probes"} == 0
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: VPN Probe in {{ $labels.source_zone }} unavailable
      description: Probe telemetry is unavailable; website connectivity is unknown.
