global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 8s
  external_labels:
    cluster: hm-cluster
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
    labels:
      service: observability
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      country: uk
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: prometheus_tsdb_head_series|prometheus_tsdb_storage_blocks_bytes|process_resident_memory_bytes
    action: keep
- job_name: node-exporter
  static_configs:
  - targets:
    - 87.106.74.217:9100
    labels:
      node: machine
      service: infrastructure
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      host: uk-ldn-1/1
      machine: 87.106.74.217
      country: uk
  - targets:
    - 212.116.115.29:9100
    labels:
      node: spb-01
      service: infrastructure
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      country: ru
  sample_limit: 1500
  scheme: https
  tls_config:
    ca_file: /etc/prometheus/spb-tls/ca.crt
    cert_file: /etc/prometheus/spb-tls/tls.crt
    key_file: /etc/prometheus/spb-tls/tls.key
- job_name: kubelet
  scheme: https
  metrics_path: /metrics/resource
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  static_configs:
  - targets:
    - 87.106.74.217:10250
    labels:
      service: infrastructure
      node: machine
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      host: uk-ldn-1/1
      machine: 87.106.74.217
      country: uk
  - targets:
    - 212.116.115.29:10250
    labels:
      service: infrastructure
      node: spb-01
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      country: ru
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: node_cpu_usage_seconds_total|node_memory_working_set_bytes
    action: keep
  sample_limit: 2000
- job_name: xray
  metrics_path: /scrape
  static_configs:
  - targets:
    - uk-ldn-1-xray-exporter.hm.svc.cluster.local:9550
    labels:
      service: gateway
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      country: uk
  - targets:
    - ru-spb-1-xray-exporter.hm.svc.cluster.local:9550
    labels:
      service: gateway
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      country: ru
  sample_limit: 5000
  metric_relabel_configs:
  - source_labels:
    - dimension
    - target
    regex: user;spb-relay@local
    action: drop
- job_name: vpn-client-probes
  scheme: http
  metrics_path: /metrics
  scrape_interval: 15s
  scrape_timeout: 10s
  static_configs:
  - targets:
    - ru-spb-1-vpn-probe.hm.svc.cluster.local:9115
    labels:
      service: vpn-probe
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      source_pop: ru-spb
      source_zone: ru-spb-1
      country: ru
      source_country: ru
  sample_limit: 100
  honor_timestamps: true
rule_files:
- /etc/prometheus/spb-rules.yml
- /etc/prometheus/host-rules.yml
