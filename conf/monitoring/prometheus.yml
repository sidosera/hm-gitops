global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 8s
  external_labels:
    cluster: hm-cluster
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
    labels:
      service: observability
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      country: uk
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: prometheus_tsdb_head_series|prometheus_tsdb_storage_blocks_bytes|process_resident_memory_bytes
    action: keep
- job_name: node-exporter
  static_configs:
  - targets:
    - 87.106.74.217:9100
    labels:
      node: machine
      service: infrastructure
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      host: uk-ldn-1/1
      machine: 87.106.74.217
      country: uk
  - targets:
    - 212.116.115.29:9100
    labels:
      node: spb-01
      service: infrastructure
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      country: ru
  sample_limit: 1500
  scheme: https
  tls_config: &id001
    ca_file: /etc/prometheus/spb-tls/ca.crt
    cert_file: /etc/prometheus/spb-tls/tls.crt
    key_file: /etc/prometheus/spb-tls/tls.key
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: xray_.*
    target_label: service
    replacement: gateway
- job_name: kubelet
  scheme: https
  metrics_path: /metrics/resource
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  static_configs:
  - targets:
    - 87.106.74.217:10250
    labels:
      service: infrastructure
      node: machine
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      host: uk-ldn-1/1
      machine: 87.106.74.217
      country: uk
  - targets:
    - 212.116.115.29:10250
    labels:
      service: infrastructure
      node: spb-01
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      country: ru
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: node_cpu_usage_seconds_total|node_memory_working_set_bytes|container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_start_time_seconds|pod_cpu_usage_seconds_total|pod_memory_working_set_bytes
    action: keep
  sample_limit: 2000
- job_name: kube-state-metrics
  static_configs:
  - targets:
    - kube-state-metrics.hm.svc.cluster.local:8080
    labels:
      service: kubernetes
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      country: uk
  sample_limit: 1500
- job_name: xray
  metrics_path: /scrape
  static_configs:
  - targets:
    - uk-ldn-1-xray-exporter.hm.svc.cluster.local:9550
    labels:
      service: gateway
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      country: uk
  - targets:
    - ru-spb-1-xray-exporter.hm.svc.cluster.local:9550
    labels:
      service: gateway
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      country: ru
  sample_limit: 500
- job_name: gateway-blackbox
  scheme: https
  tls_config: *id001
  static_configs:
  - targets:
    - 212.116.115.29:9115
    labels:
      node: spb-01
      service: observability
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      country: ru
  sample_limit: 500
- job_name: gateway-transport-probes
  scheme: https
  metrics_path: /probe
  scrape_interval: 30s
  scrape_timeout: 15s
  tls_config: *id001
  static_configs:
  - targets:
    - https://api.ipify.org
    labels:
      check: primary
      module: uk_primary
      node: spb-01
      service: gateway
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      source_pop: ru-spb
      source_zone: ru-spb-1
      target_pop: uk-ldn
      target_zone: uk-ldn-1
      country: ru
      source_country: ru
      target_country: uk
  - targets:
    - https://api.ipify.org
    labels:
      check: backup
      module: uk_backup
      node: spb-01
      service: gateway
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      source_pop: ru-spb
      source_zone: ru-spb-1
      target_pop: uk-ldn
      target_zone: uk-ldn-1
      country: ru
      source_country: ru
      target_country: uk
  - targets:
    - https://api.ipify.org
    labels:
      check: internet
      module: ru_direct
      node: spb-01
      service: gateway
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      source_pop: ru-spb
      source_zone: ru-spb-1
      target_pop: ru-spb
      target_zone: ru-spb-1
      country: ru
      source_country: ru
      target_country: ru
  - targets:
    - https://api.ipify.org
    labels:
      check: split-default
      module: split_default
      node: spb-01
      service: gateway
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      source_pop: ru-spb
      source_zone: ru-spb-1
      target_pop: ru-spb
      target_zone: ru-spb-1
      country: ru
      source_country: ru
      target_country: ru
  - targets:
    - https://ya.ru
    labels:
      check: ru-site
      module: ru_http
      node: spb-01
      service: gateway
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      host: ru-spb-1/1
      machine: 212.116.115.29
      source_pop: ru-spb
      source_zone: ru-spb-1
      target_pop: ru-spb
      target_zone: ru-spb-1
      country: ru
      source_country: ru
      target_country: ru
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - module
    target_label: __param_module
  - target_label: instance
    replacement: spb-01
  - target_label: __address__
    replacement: 212.116.115.29:9115
  sample_limit: 100
- job_name: vpn-client-probes
  scheme: http
  metrics_path: /metrics
  scrape_interval: 15s
  scrape_timeout: 10s
  static_configs:
  - targets:
    - ru-spb-1-vpn-probe.hm.svc.cluster.local:9115
    labels:
      service: vpn-probe
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      source_pop: ru-spb
      source_zone: ru-spb-1
      country: ru
      source_country: ru
  sample_limit: 100
  honor_timestamps: true
rule_files:
- /etc/prometheus/spb-rules.yml
- /etc/prometheus/service-rules.yml
