global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 8s
  external_labels:
    cluster: hm-cluster
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
    labels:
      service: observability
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      country: uk
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: prometheus_tsdb_head_series|prometheus_tsdb_storage_blocks_bytes|process_resident_memory_bytes
    action: keep
- job_name: node-exporter
  sample_limit: 1500
  scheme: https
  tls_config:
    ca_file: /etc/prometheus/spb-tls/ca.crt
    cert_file: /etc/prometheus/spb-tls/tls.crt
    key_file: /etc/prometheus/spb-tls/tls.key
    server_name: node-exporter.hm.svc.cluster.local
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_node_label_hm_gitops_cluster
    regex: .+
    action: keep
  - source_labels:
    - __meta_kubernetes_node_address_InternalIP
    regex: (.+)
    target_label: __address__
    replacement: $1:9100
  - source_labels:
    - __meta_kubernetes_node_label_hm_gitops_cluster
    target_label: cluster
  - source_labels:
    - __meta_kubernetes_node_label_topology_kubernetes_io_zone
    target_label: zone
  - source_labels:
    - __meta_kubernetes_node_annotation_hm_gitops_host
    target_label: host
  - source_labels:
    - __meta_kubernetes_node_label_hm_gitops_machine
    target_label: machine
  - source_labels:
    - __meta_kubernetes_node_label_hm_gitops_pop
    target_label: pop
  - source_labels:
    - __meta_kubernetes_node_label_hm_gitops_country
    target_label: country
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: node
  - target_label: service
    replacement: infrastructure
  metric_relabel_configs:
  - source_labels:
    - __name__
    - device
    regex: node_network_.*;hm0
    action: drop
- job_name: xray
  metrics_path: /scrape
  static_configs:
  - targets:
    - uk-ldn-1-xray-exporter.hm.svc.cluster.local:9550
    labels:
      service: gateway
      pop: uk-ldn
      zone: uk-ldn-1
      cluster: hm-cluster
      country: uk
  - targets:
    - ru-spb-1-xray-exporter.hm.svc.cluster.local:9550
    labels:
      service: gateway
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      country: ru
  sample_limit: 5000
  metric_relabel_configs:
  - source_labels:
    - dimension
    - target
    regex: user;spb-relay@(?:local|service-account)
    action: drop
- job_name: vpn-client-probes
  scheme: http
  metrics_path: /metrics
  scrape_interval: 15s
  scrape_timeout: 10s
  static_configs:
  - targets:
    - ru-spb-1-vpn-probe.hm.svc.cluster.local:9115
    labels:
      service: vpn-probe
      pop: ru-spb
      zone: ru-spb-1
      cluster: hm-cluster
      source_pop: ru-spb
      source_zone: ru-spb-1
      country: ru
      source_country: ru
  sample_limit: 100
  honor_timestamps: true
rule_files:
- /etc/prometheus/spb-rules.yml
- /etc/prometheus/host-rules.yml
