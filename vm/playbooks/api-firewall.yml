---
# Apply only the API access policy, using the same inventory as full provisioning.
- name: Register cluster inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Set inventory action
      ansible.builtin.set_fact:
        hm_action: deploy
    - name: Load controller inventory
      ansible.builtin.include_tasks: ../tasks/controller_inventory.yml

- name: Restrict Kubernetes API on cluster hosts
  hosts: vm
  become: true
  gather_facts: false
  vars_files:
    - ../roles/vm/defaults/main.yml
  tasks:
    - name: Apply API firewall policy
      ansible.builtin.include_tasks: ../roles/vm/tasks/api-firewall.yml
