---
- name: Register shared inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.set_fact:
        hm_action: deploy
    - ansible.builtin.include_tasks: ../tasks/controller_inventory.yml
- name: Enable datastore encryption on control-plane servers
  hosts: vm
  become: true
  gather_facts: true
  vars_files:
    - ../roles/vm/defaults/main.yml
  tasks:
    - name: Select the shared platform adapter
      ansible.builtin.include_role:
        name: vm
        tasks_from: assert_os
        public: true
    - ansible.builtin.include_tasks: ../roles/vm/tasks/secrets-encryption.yml
      when: not (hm_is_agent | bool)
