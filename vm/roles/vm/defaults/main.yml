---
# k3s (https://k3s.io/) — bare-metal Kubernetes distribution used for the cluster nodes.
hm_k3s_channel: stable
hm_k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
hm_node_ipv6: ""
hm_base_packages:
  - apache2-utils
  - ca-certificates
  - curl
  - ufw
  - wget
  - unzip
  - util-linux
  - gnupg
  - python3
  - git

hm_apply_security: true
hm_auto_firewall: true
hm_auto_fail2ban: true
hm_auto_unattended_upgrades: true
hm_auto_ssh_harden: true

# Teardown: set true to run k3s-uninstall.sh (destructive).
hm_teardown_uninstall_k3s: false

# Match the shared K3s pod networks and wireguard-native CNI devices.
hm_api_pod_cidrs:
  - 10.42.0.0/16
  - fd00:42::/48
hm_api_pod_interfaces:
  - cni0
  - flannel-wg
  - flannel-wg-v6

# Public age recipient only; private identities never belong in inventory.
hm_sops_age_recipient: age1xpd0gspqq4d2neww2gwerv8p7mt2v7lyuazk5mmz2677my9rp93qd76ves
