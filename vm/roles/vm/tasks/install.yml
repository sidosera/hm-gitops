---
- ansible.builtin.include_tasks: packages.yml
- name: Host hardening (UFW, SSH snippet, etc.)
  ansible.builtin.include_tasks: security.yml
  when: (hm_machine_profile.apply_security | default(hm_apply_security)) | bool
- ansible.builtin.include_tasks: low-memory.yml
- ansible.builtin.include_tasks: k3s.yml
  when: not (hm_is_agent | default(false) | bool)
- ansible.builtin.include_tasks: k3s-agent.yml
  when: hm_is_agent | default(false) | bool

- name: Label node placement independently of service identity
  ansible.builtin.include_tasks: node-labels.yml
