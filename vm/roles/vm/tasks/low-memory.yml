---
- name: Keep IPv6 router advertisements while forwarding pod traffic
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-hm-kubernetes.conf
    mode: '0644'
    content: |
      net.ipv6.conf.all.accept_ra=2
      net.ipv6.conf.default.accept_ra=2
- name: Apply IPv6 router advertisement setting
  ansible.builtin.command: sysctl --system
  changed_when: false
- name: Enable WireGuard kernel module
  ansible.builtin.command: modprobe wireguard
  changed_when: false
- name: Stop optional desktop and redundant host daemons
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - fwupd.service
    - fwupd-refresh.service
    - fwupd-refresh.timer
    - packagekit.service
    - multipathd.service
    - multipathd.socket
    - fail2ban.service
  failed_when: false
  when: not (hm_machine_profile.auto_fail2ban | default(true) | bool)

- name: Create background package maintenance drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    mode: '0755'
  loop:
    - apt-daily
    - apt-daily-upgrade

- name: Keep package maintenance below serving traffic priority
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.service.d/20-hm-resources.conf"
    mode: '0644'
    content: |
      [Service]
      CPUWeight=10
      CPUQuota=25%
      IOWeight=10
      Nice=19
      IOSchedulingClass=idle
      # Soft reclaim/throttling only: no hard limit that could kill dpkg.
      MemoryHigh=128M
  loop:
    - apt-daily
    - apt-daily-upgrade
  register: hm_package_maintenance_qos

- name: Reload package maintenance resource policy
  ansible.builtin.systemd:
    daemon_reload: true
  when: hm_package_maintenance_qos.changed
