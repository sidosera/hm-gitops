---
- name: Require OpenRC for Alpine hosts
  ansible.builtin.assert:
    that: ansible_service_mgr == 'openrc'
    fail_msg: Alpine hosts must boot OpenRC before provisioning.
- name: Persist unified cgroup mode
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^rc_cgroup_mode='
    line: 'rc_cgroup_mode="{{ hm_machine_profile.cgroup_mode }}"'
- name: Enable cgroups at boot
  ansible.builtin.service:
    name: cgroups
    use: service
    runlevel: boot
    enabled: true
    state: started
- name: Enable module loading at boot
  ansible.builtin.service:
    name: modules
    use: service
    enabled: true
    runlevel: boot
- name: Enable sysctl settings at boot
  ansible.builtin.service:
    name: sysctl
    use: service
    enabled: true
    runlevel: boot
