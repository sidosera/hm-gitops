---
# Updates are explicit administrator maintenance, never a background workload.
- name: Disable periodic Debian package updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Enable "0";
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
  when: ansible_os_family == 'Debian'
- name: Remove obsolete Alpine update job and helper
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/periodic/daily/hm-packages
    - /usr/local/sbin/hm-apk-upgrade
  when: ansible_distribution == 'Alpine'
