---
- name: Install encrypted recovery and configuration tooling
  ansible.builtin.apt:
    name:
      - age
      - python3-yaml
    state: present
- name: Enable K3s encryption and migrate existing Secrets without replacing identities
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../roles/vm/files/enable-secrets-encryption.py {{ hm_sops_age_recipient | quote }}"
    executable: python3
  register: hm_encryption_migration
  changed_when: >-
    'Secrets encryption enabled;' in hm_encryption_migration.stdout or
    'Secrets storage predecessors rewritten;' in hm_encryption_migration.stdout or
    'Historical plaintext removed from SQLite records;' in hm_encryption_migration.stdout
- name: Show encryption migration status without credentials
  ansible.builtin.debug:
    var: hm_encryption_migration.stdout_lines
- name: Verify encrypted records without exposing Secret values
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../roles/vm/files/verify-secrets-encryption.py"
    executable: python3
  register: hm_encrypted_record_check
  changed_when: false
- name: Show encrypted storage verification
  ansible.builtin.debug:
    var: hm_encrypted_record_check.stdout_lines
