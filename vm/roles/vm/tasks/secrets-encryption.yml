---
- name: Install age for encrypted recovery backups
  ansible.builtin.apt:
    name: age
    state: present
- name: Enable K3s encryption and migrate existing Secrets without replacing identities
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../roles/vm/files/enable-secrets-encryption.py {{ hm_sops_age_recipient | quote }}"
    executable: python3
  register: hm_encryption_migration
  changed_when: "'Secrets encryption enabled;' in hm_encryption_migration.stdout"
- name: Show encryption migration status without credentials
  ansible.builtin.debug:
    var: hm_encryption_migration.stdout_lines
