---
- name: Create Kubernetes configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0750'
- name: Read join token over SSH from bootstrap node
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/agent-token
  delegate_to: "{{ hm_bootstrap_host }}"
  register: hm_agent_token
  no_log: true
- name: Write worker configuration
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
    content: "{{ config | to_nice_yaml }}"
  vars:
    config:
      server: "https://{{ hm_bootstrap_api_host }}:6443"
      token: "{{ hm_agent_token.content | b64decode | trim }}"
      node-name: "{{ hm_node_name }}"
      node-ip: "{{ ansible_host }},{{ hm_node_ipv6 }}"
      node-external-ip: "{{ ansible_host }}"
      node-taint: ['hm.gitops/edge=spb:NoSchedule']
      kubelet-arg:
        - system-reserved=memory=64Mi
        - kube-reserved=memory=96Mi
        - eviction-hard=memory.available<40Mi,nodefs.available<5%,imagefs.available<5%
        - max-pods=20
      kube-proxy-arg: ['conntrack-max-per-core=8192', 'conntrack-min=8192']
  no_log: true
  register: hm_agent_config
- name: Download shared Kubernetes installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/k3s-install.sh
    mode: '0755'
- name: Install version matching the control plane
  ansible.builtin.command: /usr/local/src/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ hm_k3s_version }}"
    INSTALL_K3S_EXEC: agent
  args:
    creates: /usr/local/bin/k3s
- name: Enable Kubernetes worker
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: "{{ 'restarted' if hm_agent_config.changed else 'started' }}"
