---
- name: Reset and configure UFW from machine profile
  when: (hm_machine_profile.auto_firewall | default(hm_auto_firewall)) | bool
  block:
    - name: Apply UFW rules
      ansible.builtin.shell: |
        set -e
        ufw --force reset >/dev/null
        {% for port in hm_machine_profile.firewall_allowed_tcp | default([]) %}
        {% if port | int == 22 %}
        {% for peer in (hm_cluster_peers | default([]) + hm_cluster_peer_ipv6 | default([])) if peer != ansible_host and peer != hm_node_ipv6 and peer | length > 0 %}
        ufw deny from {{ peer | quote }} to any port 22 proto tcp >/dev/null
        {% endfor %}
        ufw limit 22/tcp >/dev/null
        {% elif port | int != 6443 and (not (hm_is_agent | default(false) | bool) or port | int == 443) %}
        ufw allow {{ port }}/tcp >/dev/null
        {% endif %}
        {% endfor %}
        {% for peer in hm_cluster_peers | default([]) if peer != ansible_host %}
        ufw allow from {{ peer | quote }} to any port 51822 proto udp >/dev/null
        {% endfor %}
        ufw allow in on hm0 from {{ hm_network.cidr | quote }} >/dev/null
        ufw allow in on hm0 from {{ hm_network.cidr_ipv6 | quote }} >/dev/null
        ufw default deny incoming >/dev/null
        ufw default allow outgoing >/dev/null
        ufw --force enable >/dev/null
      changed_when: false

- name: Restrict Kubernetes API to cluster traffic
  ansible.builtin.include_tasks: api-firewall.yml

- name: Install and enable fail2ban
  when: (hm_machine_profile.auto_fail2ban | default(hm_auto_fail2ban)) | bool
  block:
    - name: Install fail2ban
      ansible.builtin.package:
        name: "{{ hm_fail2ban_packages }}"
        state: present
    - name: Enable fail2ban
      ansible.builtin.service:
        use: "{{ hm_service_backend }}"
        name: fail2ban
        enabled: true
        state: started

- name: Disable automatic package maintenance
  ansible.builtin.include_tasks: updates.yml

- name: SSH hardening snippet
  ansible.builtin.include_tasks: ssh-hardening.yml
  when: (hm_machine_profile.auto_ssh_harden | default(hm_auto_ssh_harden)) | bool

- name: Block public NodePorts before kube-proxy accepts them
  ansible.builtin.include_tasks: nodeport-firewall.yml

- name: Enable persistent UFW on OpenRC hosts
  ansible.builtin.service:
    name: ufw
    use: service
    enabled: true
    state: started
  when:
    - ansible_distribution == 'Alpine'
    - (hm_machine_profile.auto_firewall | default(hm_auto_firewall)) | bool
