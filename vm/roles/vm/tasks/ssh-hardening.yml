---
- name: Load SSH drop-ins before any Match block
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include /etc/ssh/sshd_config.d/\*.conf$'
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  register: hm_ssh_include
- name: Drop weak SSH defaults
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hm.conf
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 3
  register: hm_ssh_snippet
- name: Remove superseded HM SSH snippets
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/sshd_config.d/99-hm.conf
    - /etc/ssh/sshd_config.d/00-hm-spb.conf
  register: hm_ssh_legacy
- name: Validate SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
- name: Enable administrative SSH at boot
  ansible.builtin.service:
    use: "{{ hm_service_backend }}"
    name: "{{ hm_ssh_service }}"
    enabled: true
    state: started
- name: Reload SSH
  ansible.builtin.service:
    use: "{{ hm_service_backend }}"
    name: "{{ hm_ssh_service }}"
    state: reloaded
  when: hm_ssh_include.changed or hm_ssh_snippet.changed or hm_ssh_legacy.changed
