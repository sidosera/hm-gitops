---
- name: Bootstrap Python on minimal Alpine images
  ansible.builtin.raw: |
    if command -v python3 >/dev/null 2>&1; then
      echo HM_PYTHON_PRESENT
    elif command -v apk >/dev/null 2>&1; then
      apk add --no-cache python3 && echo HM_PYTHON_INSTALLED
    else
      echo 'Python 3 is required on this distribution' >&2
      exit 1
    fi
  register: hm_python_bootstrap
  changed_when: "'HM_PYTHON_INSTALLED' in hm_python_bootstrap.stdout"
- name: Gather host facts after Python bootstrap
  ansible.builtin.setup:
