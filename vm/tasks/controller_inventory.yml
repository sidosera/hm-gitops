---
- name: Assert VM hosts file input present
  ansible.builtin.assert:
    that:
      - vm_hosts_file is defined
      - (vm_hosts_file | string | length) > 0
    fail_msg: "Set vm_hosts_file to a YAML file containing vm_hosts: [IPv4, ...]."
  when: hm_action in ['deploy', 'teardown']

- name: Load shared VM group vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir | dirname }}/group_vars/all.yml"
  when: hm_action in ['deploy', 'teardown']

- name: Resolve inventory relative to the controller working directory
  ansible.builtin.set_fact:
    hm_inventory_file: "{{ vm_hosts_file | realpath }}"
  when: hm_action in ['deploy', 'teardown']

- name: Load VM hosts definition
  ansible.builtin.include_vars:
    file: "{{ hm_inventory_file }}"
  when: hm_action in ['deploy', 'teardown']

- name: Load the selected cluster host profile
  ansible.builtin.include_vars:
    file: "{{ hm_inventory_file | dirname }}/profile.yml"
  when: hm_action in ['deploy', 'teardown']

- name: Assert cluster inventory structure present
  ansible.builtin.assert:
    that:
      - vm_hosts is defined
      - vm_hosts is sequence
      - (vm_hosts | length) > 0
      - ansible_user is defined
      - (ansible_user | string | length) > 0
    fail_msg: >-
      Set vm_hosts in the selected hosts file and ansible_user in vm/group_vars/all.yml.
  when: hm_action in ['deploy', 'teardown']

- name: Validate the shared kernel and role policy
  ansible.builtin.assert:
    that:
      - vm_cluster_profile.k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
      - not (vm_cluster_profile.host.automatic_package_updates | bool)
      - vm_cluster_profile.host.cgroup_mode == 'unified'
      - vm_cluster_profile.host.transparent_hugepages in ['never', 'madvise', 'always']
      - vm_cluster_profile.host.kernel_modules | difference(['overlay', 'br_netfilter', 'wireguard']) | length == 0
      - vm_cluster_profile.host.sysctls.keys() | difference(['net.ipv6.conf.all.accept_ra', 'net.ipv6.conf.default.accept_ra']) | length == 0
      - vm_cluster_profile.roles.keys() | sort == ['agent', 'control_plane']
      - vm_hosts | intersect(vm_agent_hosts | default([])) | length == 0
    fail_msg: Invalid cluster profile or overlapping control-plane/agent inventory.
  when: hm_action in ['deploy', 'teardown']

- name: Restrict role configuration to supported resource settings
  ansible.builtin.assert:
    that:
      - item.value.k3s_config.keys() | difference(['kubelet-arg', 'kube-proxy-arg']) | length == 0
    fail_msg: Role configuration must not override node identity, join credentials or networking.
  loop: "{{ vm_cluster_profile.roles | dict2items }}"
  when: hm_action in ['deploy', 'teardown']

- name: Assert VM hosts are plain IPv4 addresses
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
    fail_msg: >-
      vm_hosts must contain only IPv4 addresses. Set vm_node_ipv6 separately for IPv6.
  loop: "{{ vm_hosts + (vm_agent_hosts | default([])) }}"
  when: hm_action in ['deploy', 'teardown']

- name: Validate each machine's explicit Kubernetes role
  ansible.builtin.assert:
    that:
      - vm_node_settings[item].role == ('agent' if item in (vm_agent_hosts | default([])) else 'control_plane')
    fail_msg: Each host role must match its control-plane or agent inventory group.
  loop: "{{ vm_hosts + (vm_agent_hosts | default([])) }}"
  when: hm_action in ['deploy', 'teardown']

- name: Validate private network identities before connecting to hosts
  ansible.builtin.assert:
    that:
      - vm_cluster_profile.network.interface == 'hm0'
      - vm_cluster_profile.network.port == 51822
      - vm_node_settings.values() | map(attribute='private_ipv4') | unique | length == vm_node_settings | length
      - vm_node_settings[item].private_ipv4 is match('^10\.77\.[0-9]{1,3}\.[0-9]{1,3}$')
      - vm_node_settings[item].zone is match('^[a-z0-9]+(-[a-z0-9]+)*$')
    fail_msg: Invalid or duplicate private network identity.
  loop: "{{ vm_hosts + (vm_agent_hosts | default([])) }}"
  when: hm_action in ['deploy', 'teardown']

- name: Validate inventory addresses and logical slots without contacting hosts
  ansible.builtin.command:
    argv: ['{{ ansible_playbook_python }}', '{{ playbook_dir }}/../../scripts/cluster_inventory.py', --inventory, '{{ hm_inventory_file }}', --validate-only]
  changed_when: false
  when: hm_action == 'deploy'

- name: Resolve bootstrap host
  ansible.builtin.set_fact:
    hm_bootstrap_host_name: "{{ vm_hosts[0] }}"
  when: hm_action in ['deploy', 'teardown']

- name: Add cluster hosts to in-memory inventory
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups:
      - vm
    ansible_host: "{{ item }}"
    ansible_user: "{{ vm_node_settings[item].user | default(ansible_user) }}"
    hm_bootstrap_host: "{{ hm_bootstrap_host_name }}"
    hm_bootstrap_api_host: "{{ vm_node_settings[hm_bootstrap_host_name].private_ipv4 }}"
    hm_inventory_file: "{{ hm_inventory_file }}"
    hm_private_ipv6: "{{ vm_node_settings[item].private_ipv6 }}"
    hm_private_ipv4: "{{ vm_node_settings[item].private_ipv4 }}"
    hm_network: "{{ vm_cluster_profile.network }}"
    hm_cluster_machines: "{{ vm_node_settings }}"
    hm_is_bootstrap: "{{ item == hm_bootstrap_host_name }}"
    hm_node_ipv6: "{{ vm_node_settings[item].ipv6 | default(vm_node_ipv6 | default('')) }}"
    hm_node_country: "{{ vm_node_settings[item].country | default('') }}"
    hm_node_zone: "{{ vm_node_settings[item].zone | default('') }}"
    hm_node_name: "{{ vm_node_settings[item].kubernetes_name | default(item) }}"
    hm_machine_name: "{{ item }}"
    hm_node_pop: "{{ vm_node_settings[item]['pop'] | default('') }}"
    hm_node_host: "{{ vm_node_settings[item].host | default('') }}"
    hm_cluster_name: "{{ hm_cluster_name }}"
    hm_node_role: "{{ vm_node_settings[item].role }}"
    hm_is_agent: "{{ vm_node_settings[item].role == 'agent' }}"
    hm_role_profile: "{{ vm_cluster_profile.roles[vm_node_settings[item].role] }}"
    hm_node_taints: "{{ vm_node_settings[item].taints | default([]) }}"
    hm_edge_node: "{{ vm_node_settings[item].edge | default(false) }}"
    hm_service_lb: "{{ vm_node_settings[item].service_lb | default(false) }}"
    hm_cluster_peer_ipv6: "{{ vm_node_settings.values() | map(attribute='ipv6', default='') | list }}"
    hm_cluster_peers: "{{ vm_hosts + (vm_agent_hosts | default([])) }}"
    hm_k3s_version: "{{ vm_cluster_profile.k3s_version }}"
    hm_machine_profile: "{{ vm_cluster_profile.host }}"
    hm_action: "{{ hm_action }}"
  loop: "{{ vm_hosts + (vm_agent_hosts | default([])) }}"
  when: hm_action in ['deploy', 'teardown']
