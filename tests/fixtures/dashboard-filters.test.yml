rule_files:
- ../../conf/monitoring/service-rules.yml
evaluation_interval: 30s
tests:
- interval: 30s
  input_series:
  - series: node_uname_info{host="uk-ldn-1/1",cluster="hm-cluster",zone="uk-ldn-1",job="node",node="machine",country="uk"}
    values: 1+0x6
  - series: node_uname_info{host="ru-spb-1/1",cluster="hm-cluster",zone="ru-spb-1",job="node",node="spb-01",country="ru"}
    values: 1+0x6
  - series: kube_pod_info{namespace="hm",pod="proxy-service-fixture",node="machine",country="uk",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_status_phase{namespace="hm",pod="proxy-service-fixture",phase="Running"}
    values: 1+0x6
  - series: kube_pod_status_ready{namespace="hm",pod="proxy-service-fixture",condition="true"}
    values: 1+0x6
  - series: pod_memory_working_set_bytes{job="kubelet",namespace="hm",pod="proxy-service-fixture"}
    values: 100+0x6
  - series: container_cpu_usage_seconds_total{job="kubelet",namespace="hm",pod="proxy-service-fixture",container="app"}
    values: 0+30x6
  - series: kube_pod_container_status_restarts_total{namespace="hm",pod="proxy-service-fixture",container="app"}
    values: 0+0x6
  - series: kube_pod_info{namespace="hm",pod="spb-gateway-fixture",node="spb-01",country="uk",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_status_phase{namespace="hm",pod="spb-gateway-fixture",phase="Running"}
    values: 1+0x6
  - series: kube_pod_status_ready{namespace="hm",pod="spb-gateway-fixture",condition="true"}
    values: 0+0x6
  - series: pod_memory_working_set_bytes{job="kubelet",namespace="hm",pod="spb-gateway-fixture"}
    values: 50+0x6
  - series: container_cpu_usage_seconds_total{job="kubelet",namespace="hm",pod="spb-gateway-fixture",container="app"}
    values: 0+30x6
  - series: kube_pod_container_status_restarts_total{namespace="hm",pod="spb-gateway-fixture",container="app"}
    values: 0+0x6
  - series: kube_pod_info{namespace="hm",pod="www-service-fixture",node="machine",country="uk",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_status_phase{namespace="hm",pod="www-service-fixture",phase="Running"}
    values: 1+0x6
  - series: kube_pod_status_ready{namespace="hm",pod="www-service-fixture",condition="true"}
    values: 1+0x6
  - series: pod_memory_working_set_bytes{job="kubelet",namespace="hm",pod="www-service-fixture"}
    values: 20+0x6
  - series: container_cpu_usage_seconds_total{job="kubelet",namespace="hm",pod="www-service-fixture",container="app"}
    values: 0+30x6
  - series: kube_pod_container_status_restarts_total{namespace="hm",pod="www-service-fixture",container="app"}
    values: 0+0x6
  - series: kube_pod_info{namespace="hm",pod="prometheus-fixture",node="machine",country="uk",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_status_phase{namespace="hm",pod="prometheus-fixture",phase="Running"}
    values: 1+0x6
  - series: kube_pod_status_ready{namespace="hm",pod="prometheus-fixture",condition="true"}
    values: 1+0x6
  - series: pod_memory_working_set_bytes{job="kubelet",namespace="hm",pod="prometheus-fixture"}
    values: 60+0x6
  - series: container_cpu_usage_seconds_total{job="kubelet",namespace="hm",pod="prometheus-fixture",container="app"}
    values: 0+30x6
  - series: kube_pod_container_status_restarts_total{namespace="hm",pod="prometheus-fixture",container="app"}
    values: 0+0x6
  - series: kube_pod_info{namespace="hm",pod="node-exporter-fixture",node="spb-01",country="uk",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_status_phase{namespace="hm",pod="node-exporter-fixture",phase="Running"}
    values: 1+0x6
  - series: kube_pod_status_ready{namespace="hm",pod="node-exporter-fixture",condition="true"}
    values: 1+0x6
  - series: pod_memory_working_set_bytes{job="kubelet",namespace="hm",pod="node-exporter-fixture"}
    values: 10+0x6
  - series: container_cpu_usage_seconds_total{job="kubelet",namespace="hm",pod="node-exporter-fixture",container="app"}
    values: 0+30x6
  - series: kube_pod_container_status_restarts_total{namespace="hm",pod="node-exporter-fixture",container="app"}
    values: 0+0x6
  - series: kube_pod_labels{namespace="hm",pod="proxy-service-fixture",label_hm_gitops_service="gateway",label_app_kubernetes_io_name="legacy-uk",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_labels{namespace="hm",pod="spb-gateway-fixture",label_hm_gitops_service="gateway",label_app_kubernetes_io_name="legacy-spb",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_labels{namespace="hm",pod="www-service-fixture",label_hm_gitops_service="website",label_app_kubernetes_io_name="www-service",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_labels{namespace="hm",pod="prometheus-fixture",label_hm_gitops_service="observability",label_app_kubernetes_io_name="prometheus",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_labels{namespace="hm",pod="node-exporter-fixture",label_hm_gitops_service="observability",label_app_kubernetes_io_name="node-exporter",service="kubernetes"}
    values: 1+0x6
  - series: node_uname_info{host="de-fra-1/1",cluster="hm-cluster",zone="de-fra-1",job="bare-metal-exporter",node="rack-17",country="de"}
    values: 1+0x6
  - series: kube_pod_info{namespace="hm",pod="arbitrary-new-workload-xyz",node="rack-17",country="uk",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_labels{namespace="hm",pod="arbitrary-new-workload-xyz",label_app_kubernetes_io_name="search",service="kubernetes"}
    values: 1+0x6
  - series: kube_pod_status_phase{namespace="hm",pod="arbitrary-new-workload-xyz",phase="Running"}
    values: 1+0x6
  - series: kube_pod_status_ready{namespace="hm",pod="arbitrary-new-workload-xyz",condition="true"}
    values: 1+0x6
  - series: pod_memory_working_set_bytes{job="kubelet",namespace="hm",pod="arbitrary-new-workload-xyz"}
    values: 25+0x6
  - series: container_memory_working_set_bytes{job="kubelet",namespace="hm",pod="www-service-fixture",container="completed-init"}
    values: 999999999+0x6
  promql_expr_test:
  - expr: count(hm:service_instance:info{service="gateway",zone="ru-spb-1"})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: sum(hm:service_instance:memory_bytes{service="gateway",zone="ru-spb-1"})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 50
  - expr: sum(hm:service_instance:memory_bytes{service="gateway"})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 150
  - expr: sum(hm:service_instance:memory_bytes{service="website",zone="uk-ldn-1"})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 20
  - expr: sum(hm:service_instance:memory_bytes{service="observability"})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 70
  - expr: sum(hm:service_instance:ready{service="gateway",zone="ru-spb-1"})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: round(sum(hm:service_instance:cpu_cores{service="gateway",zone="ru-spb-1"}),
      0.001)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: hm:service_instance:info{service="website",zone="ru-spb-1"}
    eval_time: 3m
    exp_samples: []
  - expr: sum(hm:service_instance:memory_bytes{service="search",zone="de-fra-1"})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 25
  - expr: hm:service_instance:info{service=~"legacy-uk|legacy-spb|www-service"}
    eval_time: 3m
    exp_samples: []
  - expr: count(hm:service_instance:info{service="search",node="rack-17",zone="de-fra-1"})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(node_uname_info{cluster="hm-cluster",host=~`ru-spb-1\/1`})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
