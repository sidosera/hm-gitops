# Current sparkline queries. Comparison encoding: NaN=0, failed=1, reachable=2.
# NaN != NaN in promtool expected-sample comparison; this preserves all three states.
rule_files: []
evaluation_interval: 15s
tests:
- interval: 15s
  input_series:
  - series: up{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115"}
