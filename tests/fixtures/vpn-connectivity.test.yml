rule_files: []
evaluation_interval: 15s
tests:
- interval: 15s
  input_series:
  - series: up{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115"}
    values: 1 1 1 1 1
  - series: probe_success{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="ok",access="vpn"}
    values: 1 1 1 1 1
  - series: probe_last_run_timestamp_seconds{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="ok",access="vpn"}
    values: 0 15 30 45 60
  - series: probe_target_info{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="ok",access="vpn"}
    values: 1 1 1 1 1
  - series: probe_success{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="ok",access="direct"}
    values: 0 0 0 0 0
  - series: probe_last_run_timestamp_seconds{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="ok",access="direct"}
    values: 0 15 30 45 60
  - series: probe_target_info{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="ok",access="direct"}
    values: 1 1 1 1 1
  - series: probe_success{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="failed",access="vpn"}
    values: 1 1 1 0 1
  - series: probe_last_run_timestamp_seconds{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="failed",access="vpn"}
    values: 0 15 30 45 60
  - series: probe_target_info{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="failed",access="vpn"}
    values: 1 1 1 1 1
  - series: probe_success{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="missing",access="vpn"}
    values: _ _ _ _ _
  - series: probe_last_run_timestamp_seconds{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="missing",access="vpn"}
    values: _ _ _ _ _
  - series: probe_target_info{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="missing",access="vpn"}
    values: 1 1 1 1 1
  - series: probe_success{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="stale",access="vpn"}
    values: 1 _ _ _ _
  - series: probe_last_run_timestamp_seconds{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="stale",access="vpn"}
    values: 0 _ _ _ _
  - series: probe_target_info{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="stale",access="vpn"}
    values: 1 1 1 1 1
  promql_expr_test:
  - expr: min by(site,access) (min_over_time(probe_success{cluster=~"hm-cluster",job="vpn-client-probes",check="client-web",source_zone=~"ru-spb-1",site=~".*"}[1m])
      and on(job,instance,site,access,check) (probe_last_run_timestamp_seconds{cluster=~"hm-cluster",job="vpn-client-probes",check="client-web",source_zone=~"ru-spb-1",site=~".*"}
      > time() - 60) and on(job,instance) (up{cluster=~"hm-cluster",job="vpn-client-probes",source_zone=~"ru-spb-1"}
      == 1)) or on(site,access) (0 * max by(site,access) (probe_target_info{cluster=~"hm-cluster",job="vpn-client-probes",check="client-web",source_zone=~"ru-spb-1",site=~".*"})
      - 1)
    eval_time: 1m
    exp_samples:
    - labels: '{site="ok",access="vpn"}'
      value: 1
    - labels: '{site="ok",access="direct"}'
      value: 0
    - labels: '{site="failed",access="vpn"}'
      value: 0
    - labels: '{site="missing",access="vpn"}'
      value: -1
    - labels: '{site="stale",access="vpn"}'
      value: -1
- interval: 15s
  input_series:
  - series: up{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115"}
