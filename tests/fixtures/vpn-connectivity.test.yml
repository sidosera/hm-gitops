  - series: probe_last_run_timestamp_seconds{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="ok",access="vpn"}
    values: 0 15 30 45 60
  - series: probe_target_info{cluster="hm-cluster",job="vpn-client-probes",source_zone="ru-spb-1",instance="observer:9115",check="client-web",site="ok",access="vpn"}
    values: 1 1 1 1 1
