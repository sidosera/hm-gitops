apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray-exporter
  labels:
    app.kubernetes.io/name: xray-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: xray-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xray-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: xray-exporter
        image: ghcr.io/compassvpn/xray-exporter:v0.6.9@sha256:62a0b07799effdc68b5625fdb7e0f1fde56a4c105a4f51d98d27d36a22c50ede
        args:
        - --xray-endpoint=proxy-service.hm.svc.cluster.local:10085
        - --listen=:9550
        - --log-path=
        - --scrape-timeout=5
        - --user-traffic-metrics
        ports:
        - name: http
          containerPort: 9550
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
      volumes: []
      nodeSelector:
        hm.gitops/control-plane: 'true'
