apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hm
namePrefix: uk-ldn-1-
resources:
  - ../../base
labels:
  - pairs:
      hm.gitops/observed-zone: uk-ldn-1
    includeSelectors: true
patches:
  - target:
      kind: Deployment
      name: xray-exporter
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: --xray-endpoint=proxy-service.hm.svc.cluster.local:10085
