apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-probe
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vpn-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vpn-probe
        hm.gitops/service: vpn-probe
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: client
        image: ghcr.io/xtls/xray-core:26.10.31@sha256:ceabeac03a89d991d2a247361825c1d1d2e9c91cd5dc010f298c7dc0c2f325c9
        args:
        - run
        - -c
        - /etc/xray/config.json
        env:
        - name: GOMEMLIMIT
          value: 24MiB
        securityContext: &id001
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 12Mi
          limits:
            memory: 40Mi
        volumeMounts:
        - name: client-config
          mountPath: /etc/xray
          readOnly: true
      - name: probe
        image: python:3.14-alpine@sha256:eb2c62658b8d51bff0acc408504b76521d02030de56a8a3c1e830083e89b89d2
        args:
        - --config
        - /etc/probe/targets.json
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        ports:
        - name: http
          containerPort: 9115
        securityContext: *id001
        resources:
          requests:
            cpu: 5m
            memory: 12Mi
          limits:
            memory: 40Mi
        volumeMounts:
        - name: checks
          mountPath: /etc/probe
          readOnly: true
        readinessProbe:
          httpGet:
            path: /-/healthy
            port: http
          periodSeconds: 10
        command:
        - python3
        - -B
        - /etc/probe/probe.py
      volumes:
      - name: client-config
        secret:
          secretName: vpn-probe-client
          defaultMode: 292
      - name: checks
        configMap:
          name: vpn-probe-checks
      tolerations:
      - key: hm.gitops/edge
        operator: Exists
        effect: NoSchedule
