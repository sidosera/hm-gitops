apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpn-probe
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vpn-probe
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9115
