apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hm
namePrefix: uk-ldn-1-
resources:
- ../../base
- client-secret.sops.yaml
labels:
- pairs:
    hm.gitops/zone: uk-ldn-1
  includeSelectors: false
  includeTemplates: true
patches:
- target:
    kind: Deployment
    name: vpn-probe
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: vpn-probe\nspec:\n\
    \  template:\n    spec:\n      nodeSelector:\n        topology.kubernetes.io/zone:\
    \ uk-ldn-1\n      volumes:\n      - name: client-config\n        secret:\n   \
    \       secretName: uk-ldn-1-vpn-probe-client\n          defaultMode: 292\n  selector:\n\
    \    matchLabels:\n      hm.gitops/zone: uk-ldn-1\n"
- target:
    kind: Service
    name: vpn-probe
  patch: "apiVersion: v1\nkind: Service\nmetadata:\n  name: vpn-probe\nspec:\n  selector:\n\
    \    hm.gitops/zone: uk-ldn-1\n"
- target:
    kind: NetworkPolicy
    name: vpn-probe
  patch: "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name:\
    \ vpn-probe\nspec:\n  podSelector:\n    matchLabels:\n      hm.gitops/zone: uk-ldn-1\n"
