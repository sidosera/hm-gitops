apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hm
namePrefix: ru-spb-1-
resources:
- ../../base
labels:
- pairs:
    hm.gitops/zone: ru-spb-1
  includeSelectors: false
  includeTemplates: true
patches:
- target:
    kind: Deployment
    name: vpn-probe
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: vpn-probe\nspec:\n\
    \  template:\n    spec:\n      nodeSelector:\n        topology.kubernetes.io/zone:\
    \ ru-spb-1\n      volumes:\n      - name: client-config\n        secret:\n   \
    \       secretName: xray-credentials\n          defaultMode: 292\n          items:\n\
    \          - key: ru-spb-1.probe.json\n            path: config.json\n  selector:\n\
    \    matchLabels:\n      hm.gitops/zone: ru-spb-1\n"
- target:
    kind: Service
    name: vpn-probe
  patch: "apiVersion: v1\nkind: Service\nmetadata:\n  name: vpn-probe\nspec:\n  selector:\n\
    \    hm.gitops/zone: ru-spb-1\n"
- target:
    kind: NetworkPolicy
    name: vpn-probe
  patch: "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name:\
    \ vpn-probe\nspec:\n  podSelector:\n    matchLabels:\n      hm.gitops/zone: ru-spb-1\n"
- target:
    kind: Deployment
    name: vpn-probe
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: vpn-probe\nspec:\n\
    \  template:\n    spec:\n      dnsPolicy: None\n      dnsConfig:\n        nameservers:\n\
    \        - 141.8.194.254\n        - 141.8.197.254\n        options:\n        -\
    \ name: timeout\n          value: '2'\n        - name: attempts\n          value:\
    \ '2'\n"
