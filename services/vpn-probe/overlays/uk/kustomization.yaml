apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hm
namePrefix: uk-
resources:
- ../../base
- client-secret.sops.yaml
labels:
- pairs:
    hm.gitops/region: uk
  includeSelectors: true
patches:
- target:
    kind: Deployment
    name: vpn-probe
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: vpn-probe\nspec:\n\
    \  template:\n    spec:\n      nodeSelector:\n        topology.kubernetes.io/region:\
    \ uk\n      volumes:\n      - name: client-config\n        secret:\n         \
    \ secretName: uk-vpn-probe-client\n          defaultMode: 292\n"
