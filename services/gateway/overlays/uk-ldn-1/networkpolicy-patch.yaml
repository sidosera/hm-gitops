apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 10443
    - protocol: TCP
      port: 11443
    - protocol: TCP
      port: 18080
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: xray-exporter
    ports:
    - protocol: TCP
      port: 10085
