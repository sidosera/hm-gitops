apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- pdb.yaml
- ingressroute.yaml
- https-ingressroute.yaml
namespace: hm
labels:
- pairs:
    app.kubernetes.io/name: proxy-service
  includeSelectors: false
patches:
- path: service-patch.yaml
- path: deployment-patch.yaml
- path: networkpolicy-patch.yaml
- target:
    kind: Deployment
    name: gateway
  patch: "- op: replace\n  path: /metadata/name\n  value: proxy-service\n- op: replace\n\
    \  path: /spec/selector/matchLabels/app.kubernetes.io~1name\n  value: proxy-service\n\
    - op: replace\n  path: /spec/template/metadata/labels/app.kubernetes.io~1name\n\
    \  value: proxy-service\n"
- target:
    kind: Service
    name: gateway
  patch: "- op: replace\n  path: /metadata/name\n  value: proxy-service\n- op: replace\n\
    \  path: /spec/selector/app.kubernetes.io~1name\n  value: proxy-service\n"
- target:
    kind: NetworkPolicy
    name: gateway-ingress
  patch: "- op: replace\n  path: /metadata/name\n  value: proxy-service-ingress\n\
    - op: replace\n  path: /spec/podSelector/matchLabels/app.kubernetes.io~1name\n\
    \  value: proxy-service\n"
configMapGenerator:
- name: gateway-uk-config
  files:
  - config.json
