apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  ports:
  - $patch: replace
  - name: reality
    port: 10443
    targetPort: reality
  - name: xhttp
    port: 18080
    targetPort: xhttp
    protocol: TCP
  - name: realv2
    port: 11443
    targetPort: realv2
  - name: stats-api
    port: 10085
    targetPort: stats-api
