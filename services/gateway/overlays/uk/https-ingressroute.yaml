apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxy-service-https
  namespace: hm
  labels:
    app.kubernetes.io/name: proxy-service
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`www.hackamonth.io`) && PathPrefix(`/assets/048bac2c99a581a53174deaf742fdfe4/`)
      priority: 100
      services:
        - name: proxy-service
          port: 18080
          responseForwarding:
            flushInterval: 1ms
  tls:
    certResolver: le
