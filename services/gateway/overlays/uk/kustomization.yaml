apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- credentials-secret.sops.yaml
- pdb.yaml
- ingressroute.yaml
- https-ingressroute.yaml
namespace: hm
labels:
- pairs:
    app.kubernetes.io/name: proxy-service
  includeSelectors: false
patches:
- path: service-patch.yaml
- path: deployment-patch.yaml
- path: networkpolicy-patch.yaml
- target:
    kind: Deployment
    name: gateway
  patch: |
    - op: replace
      path: /metadata/name
      value: proxy-service
    - op: replace
      path: /spec/selector/matchLabels/app.kubernetes.io~1name
      value: proxy-service
    - op: replace
      path: /spec/template/metadata/labels/app.kubernetes.io~1name
      value: proxy-service
- target:
    kind: Service
    name: gateway
  patch: |
    - op: replace
      path: /metadata/name
      value: proxy-service
    - op: replace
      path: /spec/selector/app.kubernetes.io~1name
      value: proxy-service
- target:
    kind: NetworkPolicy
    name: gateway-ingress
  patch: |
    - op: replace
      path: /metadata/name
      value: proxy-service-ingress
    - op: replace
      path: /spec/podSelector/matchLabels/app.kubernetes.io~1name
      value: proxy-service
configMapGenerator:
- name: gateway-uk-config
  files:
  - config.json
