apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
spec:
  ingress:
  - ports:
    - protocol: TCP
      port: 14443
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: xray-exporter
    ports:
    - protocol: TCP
      port: 10085
