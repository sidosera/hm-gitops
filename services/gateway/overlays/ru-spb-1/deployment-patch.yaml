apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    hm.gitops/zone: ru-spb-1
spec:
  template:
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: ru-spb-1
      containers:
      - ports:
        - $patch: replace
        - name: reality
          containerPort: 14443
          hostPort: 443
        - name: stats-api
          containerPort: 10085
        name: xray
        env:
        - name: GOMEMLIMIT
          value: 48MiB
      volumes:
      - name: config
        projected:
          sources:
          - secret:
              name: xray-credentials
              items:
              - key: ru-spb-1.gateway.json
                path: 00-credentials.json
          - configMap:
              name: gateway-spb-config
              items:
              - key: config.json
                path: 10-config-tail.json
      tolerations:
      - key: hm.gitops/edge
        value: spb
        effect: NoSchedule
    metadata:
      annotations: {}
  strategy:
    type: Recreate
    rollingUpdate: null
