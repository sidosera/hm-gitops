apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- probe-server-secret.sops.yaml
namespace: hm
labels:
- pairs:
    app.kubernetes.io/name: spb-gateway
  includeSelectors: false
patches:
- path: service-patch.yaml
- path: deployment-patch.yaml
- path: networkpolicy-patch.yaml
- target:
    kind: Deployment
    name: gateway
  patch: "- op: replace\n  path: /metadata/name\n  value: spb-gateway\n- op: replace\n\
    \  path: /spec/selector/matchLabels/app.kubernetes.io~1name\n  value: spb-gateway\n\
    - op: replace\n  path: /spec/template/metadata/labels/app.kubernetes.io~1name\n\
    \  value: spb-gateway\n"
- target:
    kind: Service
    name: gateway
  patch: "- op: replace\n  path: /metadata/name\n  value: spb-gateway\n- op: replace\n\
    \  path: /spec/selector/app.kubernetes.io~1name\n  value: spb-gateway\n"
- target:
    kind: NetworkPolicy
    name: gateway-ingress
  patch: "- op: replace\n  path: /metadata/name\n  value: spb-gateway-ingress\n- op:\
    \ replace\n  path: /spec/podSelector/matchLabels/app.kubernetes.io~1name\n  value:\
    \ spb-gateway\n"
configMapGenerator:
- name: gateway-spb-config
  files:
  - config.json
- name: spb-blackbox-config
  files:
  - blackbox.yml
