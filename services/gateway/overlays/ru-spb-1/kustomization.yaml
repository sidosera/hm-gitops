apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- credentials-secret.sops.yaml
- probe-server-secret.sops.yaml
namespace: hm
labels:
- pairs:
    app.kubernetes.io/name: spb-gateway
  includeSelectors: false
patches:
- path: service-patch.yaml
- path: deployment-patch.yaml
- path: networkpolicy-patch.yaml
- target:
    kind: Deployment
    name: gateway
  patch: |
    - op: replace
      path: /metadata/name
      value: spb-gateway
    - op: replace
      path: /spec/selector/matchLabels/app.kubernetes.io~1name
      value: spb-gateway
    - op: replace
      path: /spec/template/metadata/labels/app.kubernetes.io~1name
      value: spb-gateway
- target:
    kind: Service
    name: gateway
  patch: |
    - op: replace
      path: /metadata/name
      value: spb-gateway
    - op: replace
      path: /spec/selector/app.kubernetes.io~1name
      value: spb-gateway
- target:
    kind: NetworkPolicy
    name: gateway-ingress
  patch: |
    - op: replace
      path: /metadata/name
      value: spb-gateway-ingress
    - op: replace
      path: /spec/podSelector/matchLabels/app.kubernetes.io~1name
      value: spb-gateway
configMapGenerator:
- name: gateway-spb-config
  files:
  - config.json
- name: spb-blackbox-config
  files:
  - blackbox.yml
