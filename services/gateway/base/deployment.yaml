apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    hm.gitops/service: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        hm.gitops/xray: 'true'
      annotations:
        hm.gitops/credentials-revision: '2026-11-03'
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65534
      containers:
      - name: xray
        imagePullPolicy: IfNotPresent
        args:
        - run
        - -confdir
        - /etc/xray
        ports:
        - name: reality
          containerPort: 10443
        - name: stats-api
          containerPort: 10085
        startupProbe:
          tcpSocket:
            port: reality
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          tcpSocket:
            port: reality
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: reality
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
        resources:
          requests:
            cpu: 20m
            memory: 24Mi
          limits:
            memory: 80Mi
        volumeMounts:
        - name: config
          mountPath: /etc/xray
          readOnly: true
        image: ghcr.io/xtls/xray-core:26.10.31@sha256:ceabeac03a89d991d2a247361825c1d1d2e9c91cd5dc010f298c7dc0c2f325c9
      volumes:
      - name: config
        projected:
          defaultMode: 292
          sources:
          - secret:
              name: gateway-credentials
              items:
              - key: credentials.json
                path: 00-credentials.json
          - configMap:
              name: gateway-config
              items:
              - key: config.json
                path: 10-config-tail.json
      terminationGracePeriodSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
