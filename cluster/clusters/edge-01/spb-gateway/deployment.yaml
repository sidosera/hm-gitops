apiVersion: apps/v1
kind: Deployment
metadata:
  name: spb-gateway
  namespace: hm
  labels:
    hm.gitops/region: spb
    hm.gitops/service: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spb-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spb-gateway
        hm.gitops/xray: 'true'
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: spb-01
      tolerations:
      - key: hm.gitops/edge
        value: spb
        effect: NoSchedule
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: xray
        image: ghcr.io/xtls/xray-core:26.10.31@sha256:ceabeac03a89d991d2a247361825c1d1d2e9c91cd5dc010f298c7dc0c2f325c9
        args:
        - run
        - -c
        - /etc/xray/config.json
        env:
        - name: GOMEMLIMIT
          value: 48MiB
        ports:
        - name: reality
          containerPort: 14443
          hostPort: 443
        - name: stats
          containerPort: 10085
        resources:
          requests:
            cpu: 20m
            memory: 24Mi
          limits:
            memory: 80Mi
        securityContext: &id001
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: xray-config
          mountPath: /etc/xray
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: reality
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: reality
          periodSeconds: 20
      - name: blackbox
        image: quay.io/prometheus/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
        args:
        - --config.file=/etc/blackbox/blackbox.yml
        - --web.listen-address=:9115
        - --web.config.file=/tls/web.yml
        ports:
        - name: probes
          containerPort: 9115
          hostPort: 9115
        resources:
          requests:
            cpu: 5m
            memory: 12Mi
          limits:
            memory: 40Mi
        securityContext: *id001
        volumeMounts:
        - name: blackbox-config
          mountPath: /etc/blackbox
          readOnly: true
        - name: server-tls
          mountPath: /tls
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: probes
          periodSeconds: 30
      volumes:
      - name: xray-config
        secret:
          secretName: spb-gateway-config-source
          defaultMode: 292
      - name: blackbox-config
        configMap:
          name: spb-blackbox-config
      - name: server-tls
        secret:
          secretName: spb-monitoring-server-tls
          defaultMode: 292
