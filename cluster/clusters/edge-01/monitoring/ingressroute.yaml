apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: hm
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`www.hackamonth.io`) && (Path(`/status`) || PathPrefix(`/status/`))
      priority: 210
      services:
        - name: grafana
          port: 3000
  tls:
    certResolver: le
