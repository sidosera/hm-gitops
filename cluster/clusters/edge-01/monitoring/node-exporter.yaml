apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: hm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stats-client
          image: docker.io/library/python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command:
            - python
            - -c
            - |
              import urllib.request,hashlib,zipfile,io,pathlib,os
              with urllib.request.urlopen('https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip',timeout=60) as response:
               data=response.read(80000000)
              if hashlib.sha256(data).hexdigest() != 'e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214':
               raise RuntimeError('Xray client checksum mismatch')
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
               with archive.open('xray') as source,open('/tools/xray','wb') as target:
                import shutil;shutil.copyfileobj(source,target)
              os.chmod('/tools/xray',0o555)
              print('Verified native stats client installed')
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: node-exporter
          image: docker.io/prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:9100
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.meminfo
            - --collector.filesystem
            - --collector.netdev
            - --collector.loadavg
            - --collector.stat
            - --collector.time
            - --collector.uname
            - --collector.vmstat
            - --collector.textfile
            - --collector.textfile.directory=/textfile
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+|var/lib/rancher/k3s/agent/containerd/.+)($|/)
          ports:
            - name: http
              containerPort: 9100
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
            - name: textfile
              mountPath: /textfile
              readOnly: true
        - name: online-clients
          image: docker.io/library/python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command:
            - python
            - -B
            - /app/online_clients.py
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 48Mi
          volumeMounts:
            - name: online-client-code
              mountPath: /app
              readOnly: true
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: textfile
              mountPath: /textfile
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: tools
          emptyDir:
            sizeLimit: 128Mi
        - name: textfile
          emptyDir:
            sizeLimit: 1Mi
        - name: online-client-code
          configMap:
            name: online-client-code
