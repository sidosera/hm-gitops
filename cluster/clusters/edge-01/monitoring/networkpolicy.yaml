---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xray-exporter-ingress
  namespace: hm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: xray-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9550
