apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: hm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
        args:
        - --resources=pods
        - --namespaces=hm
        - --metric-allowlist=kube_pod_status_ready,kube_pod_status_phase,kube_pod_container_status_restarts_total,kube_pod_container_resource_limits
        ports:
        - name: http
          containerPort: 8080
        - name: telemetry
          containerPort: 8081
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: telemetry
          initialDelaySeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 15
          timeoutSeconds: 5
      volumes: []
      serviceAccountName: kube-state-metrics
