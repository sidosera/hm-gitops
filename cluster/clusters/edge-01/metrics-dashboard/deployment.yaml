apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-dashboard
  namespace: hm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-dashboard
    spec:
      serviceAccountName: metrics-dashboard
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stats-client
          image: docker.io/library/python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command:
            - python
            - -c
            - |
              import urllib.request,hashlib,zipfile,io,pathlib,os
              with urllib.request.urlopen('https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip',timeout=60) as response:
               data=response.read(80000000)
              if hashlib.sha256(data).hexdigest() != 'e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214':
               raise RuntimeError('Xray client checksum mismatch')
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
               with archive.open('xray') as source,open('/tools/xray','wb') as target:
                import shutil;shutil.copyfileobj(source,target)
              os.chmod('/tools/xray',0o555)
              print('Verified native stats client installed')
          securityContext: &id001
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: dashboard
          image: docker.io/library/python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command:
            - python
            - -B
            - /app/app.py
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext: *id001
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: app
          configMap:
            name: metrics-dashboard-app
        - name: auth
          secret:
            secretName: metrics-dashboard-auth
        - name: tools
          emptyDir:
            sizeLimit: 128Mi
        - name: data
          persistentVolumeClaim:
            claimName: metrics-dashboard-data
