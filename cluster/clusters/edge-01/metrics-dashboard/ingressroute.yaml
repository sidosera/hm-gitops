apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: metrics-dashboard
  namespace: hm
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`www.hackamonth.io`) && (Path(`/status`) || PathPrefix(`/status/`))
      priority: 200
      services:
        - name: metrics-dashboard
          port: 8080
  tls:
    certResolver: le
