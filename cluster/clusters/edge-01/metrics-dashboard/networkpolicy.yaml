apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-dashboard-ingress
  namespace: hm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-dashboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
