apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-service-ingress
  namespace: hm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: proxy-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 10443
        - protocol: TCP
          port: 11443
        - protocol: TCP
          port: 18080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: xray-exporter
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: node-exporter
      ports:
        - protocol: TCP
          port: 10085
        - protocol: TCP
          port: 11111
