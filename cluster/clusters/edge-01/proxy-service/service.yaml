apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  labels:
    app.kubernetes.io/name: proxy-service
    app.kubernetes.io/component: edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: proxy-service
  ports:
    - name: reality
      port: 10443
      targetPort: reality
    - name: xhttp
      port: 18080
      targetPort: xhttp
      protocol: TCP
    - name: realv2
      port: 11443
      targetPort: realv2
    - name: stats-api
      port: 10085
      targetPort: stats-api
    - name: metrics
      port: 11111
      targetPort: metrics
