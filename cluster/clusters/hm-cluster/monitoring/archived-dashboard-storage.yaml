# Historical data only; no workload mounts this volume. Keep until explicit data-retention decision.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metrics-dashboard-data
  namespace: hm
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
