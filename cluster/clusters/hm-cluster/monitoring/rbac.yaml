apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: hm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hm-prometheus
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hm-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hm-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: hm
