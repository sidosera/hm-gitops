name: hmctl
on:
  pull_request:
    paths: ['cmd/hmctl/**', 'internal/hmctl/**', 'internal/cli/**', 'vm/ssh_known_hosts', 'cluster/clusters/**', 'go.mod', 'go.sum', 'Makefile', '.github/workflows/hmctl.yml']
  push:
    branches: [main]
    paths: ['cmd/hmctl/**', 'internal/hmctl/**', 'internal/cli/**', 'vm/ssh_known_hosts', 'cluster/clusters/**', 'go.mod', 'go.sum', 'Makefile', '.github/workflows/hmctl.yml']
permissions:
  contents: read
concurrency:
  group: hmctl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify dependencies, formatting, tests and static analysis
        run: |
          go mod download
          go mod verify
          make fmt-check
          make test vet
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build standalone binaries and checksums
        run: make dist VERSION="${GITHUB_SHA}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hmctl
          path: dist/
          retention-days: 14
          if-no-files-found: error
