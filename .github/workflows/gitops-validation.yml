name: GitOps validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gitops-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          python3 -m venv "$RUNNER_TEMP/gitops-venv"
          "$RUNNER_TEMP/gitops-venv/bin/pip" install PyYAML==6.0.3 cryptography==50.0.2 ansible-core==2.20.11
          echo "$RUNNER_TEMP/gitops-venv/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
          echo "7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3  $RUNNER_TEMP/kubectl" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Scan current source with redacted findings
        run: gitleaks dir . --redact=100 --no-banner
      - name: Validate manifests and security contracts
        run: |
          python -m unittest discover -s tests -v
          kubectl kustomize cluster/clusters/hm-cluster > /dev/null
      - name: Validate Prometheus configuration and rules
        run: |
          IMAGE=docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          docker run --rm --entrypoint promtool -v "$PWD/conf/monitoring:/etc/prometheus:ro" "$IMAGE" check config --syntax-only /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD:/work:ro" -w /work "$IMAGE" test rules tests/fixtures/*.test.yml
