# Converge bare-metal cluster hosts with Ansible.
# Repository secrets:
#   GITOPS_DEPLOY_KEY      dedicated hm-gitops private key
#   GITOPS_DEPLOY_KEY_B64  optional base64 of that key (for `act`)
#   GITOPS_BECOME_PASSWORD optional sudo password if the SSH user is not NOPASSWD
#
# This workflow does not apply Kubernetes workloads. It only configures hosts and installs/upgrades k3s.
name: Cluster Converge

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: Cluster name under cluster/clusters/
        required: true
        default: hm-cluster

concurrency:
  group: cluster-converge
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ansible-converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Ansible
        run: pip install --user ansible-core==2.20.11 PyYAML==6.0.3

      - name: Install pinned host provisioning collection
        run: ~/.local/bin/ansible-galaxy collection install -r vm/requirements.yml

      - name: Install hm-gitops SSH key
        env:
          GITOPS_DEPLOY_KEY_B64: ${{ secrets.GITOPS_DEPLOY_KEY_B64 }}
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${GITOPS_DEPLOY_KEY_B64}" ]; then
            echo "${GITOPS_DEPLOY_KEY_B64}" | base64 -d > ~/.ssh/gitops
          elif [ -n "${GITOPS_DEPLOY_KEY}" ]; then
            printf '%s\n' "${GITOPS_DEPLOY_KEY}" > ~/.ssh/gitops
          fi
          if [ ! -s ~/.ssh/gitops ]; then
            echo "Set repository secrets GITOPS_DEPLOY_KEY (multiline) and/or GITOPS_DEPLOY_KEY_B64 (base64)." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/gitops

      - name: Run Ansible converge
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          GITOPS_BECOME_PASSWORD: ${{ secrets.GITOPS_BECOME_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "$CLUSTER_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo 'Invalid cluster name' >&2
            exit 1
          fi
          cp vm/ssh_known_hosts ~/.ssh/known_hosts
          export ANSIBLE_SSH_ARGS='-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts'
          trap 'rm -f "$HOME/.gitops_become_pass" "$HOME/.ssh/gitops"' EXIT
          export PATH="$(python3 -m site --user-base)/bin:$PATH"
          BP="$HOME/.gitops_become_pass"
          if [ -n "${GITOPS_BECOME_PASSWORD}" ]; then
            printf '%s\n' "${GITOPS_BECOME_PASSWORD}" >"$BP"
            chmod 600 "$BP"
            ./vm/k3s-bootstrap.sh -e vm_hosts_file="$PWD/cluster/clusters/${CLUSTER_NAME}/hosts.yml" -e hm_action=deploy --private-key ~/.ssh/gitops --become-password-file "$BP"
            rm -f "$BP"
          else
            ./vm/k3s-bootstrap.sh -e vm_hosts_file="$PWD/cluster/clusters/${CLUSTER_NAME}/hosts.yml" -e hm_action=deploy --private-key ~/.ssh/gitops
          fi
